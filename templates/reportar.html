{% extends 'base.html' %}

{% block content %}
<div class="bg-black text-white p-6 border-2 border-black max-w-2xl mx-auto my-6 font-sans">
    <div class="border-b border-white/20 pb-2 mb-4 text-xs font-semibold uppercase tracking-wider">
        BLOCK 05: ISSUE REPORTING
    </div>
    <h2 class="text-3xl font-black uppercase tracking-tight mb-2">REPORTAR PROBLEMA</h2>
    <p class="text-xs text-gray-400 uppercase tracking-wide mb-6">REGISTRE ANOMALIAS DE CONECTIVIDADE NO SISTEMA.</p>
    
    <div class="space-y-4 text-xs font-bold uppercase">
        <div>
            <label class="block mb-1">Descrição Técnica</label>
            <textarea class="w-full bg-black border border-white p-3 text-white outline-none font-mono text-sm" rows="5" placeholder="Descreva os detalhes do erro ou comportamento observado..."></textarea>
        </div>
        <button class="bg-white text-black px-6 py-3 font-black uppercase hover:bg-gray-200 transition w-full text-sm tracking-wider">
            Enviar Relatório
        </button>
    </div>
</div>
{% endblock %}
