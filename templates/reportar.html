{% extends 'base.html' %}

{% block content %}
<div class="bg-gray-800 rounded-xl border border-gray-700 p-6 shadow-lg">
    <h2 class="text-2xl font-bold text-white mb-4">Reportar um Problema</h2>
    <p class="text-gray-400 mb-6">Utilize esta área para relatar anomalias na rede.</p>
    <textarea class="w-full bg-gray-900 border border-gray-600 rounded p-4 text-white outline-none focus:border-blue-500" rows="5" placeholder="Descreva o problema..."></textarea>
    <button class="mt-4 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-semibold shadow-lg transition">Enviar Relatório</button>
</div>
{% endblock %}
