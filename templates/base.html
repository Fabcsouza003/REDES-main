<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Network Monitor Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-[#EFECE6] text-black font-['Inter',sans-serif] p-3 md:p-6 min-h-screen flex flex-col justify-between select-none">
    <div class="max-w-[1400px] mx-auto w-full space-y-3 flex-1 flex flex-col justify-between">
        
        <!-- Header da Imagem -->
        <header class="border-b-2 border-black pb-2 flex justify-between items-center text-xs md:text-sm font-sans tracking-wide">
            <div class="font-extrabold tracking-wider text-black">NEUE</div>
            <div class="flex items-center gap-6 font-medium text-black">
                <a href="{{ url_for('main.index') }}" class="hover:opacity-75 transition">[Index / Experiment / About]</a>
                <span>•</span>
                <a href="{{ url_for('main.reportar') }}" class="hover:opacity-75 transition">[Reporta Problem]</a>
            </div>
            <div class="font-medium text-black hidden md:block">ATX Agency @2026</div>
        </header>

        <!-- Conteúdo das Páginas -->
        <main class="flex-1 my-3">
            {% block content %}{% endblock %}
        </main>

        <!-- Footer da Imagem -->
        <footer class="pt-2 flex justify-end items-center text-xs font-sans tracking-tight text-black">
        
        </footer>
    </div>

    <!-- Elementos dinâmicos invisíveis para compatibilidade dos scripts originais -->
    <span id="ui-speed" class="hidden">-- / --</span>

    <!-- Scripts do Sistema -->
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
